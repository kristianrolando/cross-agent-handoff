name: Package checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported Python and the newest stable release on every OS.
        # setup-python resolves 3.9 to 3.9.13 on macOS arm64 and Windows x64.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run protocol and package checks
        run: python -m unittest discover -s tests -v
      - name: Check committed whitespace
        # Compare against the empty tree; a plain diff is empty on a fresh checkout.
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
