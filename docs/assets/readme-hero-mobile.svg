<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530" role="img" aria-labelledby="title desc">
<title id="title">Switch agents. Keep the work.</title><desc id="desc">Save useful context in the shared project checkpoint. Continue in Claude Code, Codex, Antigravity or another coding agent, one writer at a time.</desc>
