<text x="30" y="151" fill="#152d29" font-size="66" font-weight="750" letter-spacing="-2">Switch agents.</text>
<text x="30" y="229" fill="#152d29" font-size="66" font-weight="750" letter-spacing="-2">Keep the work.</text>
<text x="33" y="291" fill="#455851" font-size="25">Leave useful context in your project.</text>
<text x="33" y="329" fill="#455851" font-size="25">Continue in the next agent or session.</text>
