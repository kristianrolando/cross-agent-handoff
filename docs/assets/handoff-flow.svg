<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img" aria-labelledby="title desc">
  <title id="title">Work, checkpoint, resume</title>
  <desc id="desc">First work in one agent. Save scope, verified state, evidence and the next action in the project. Stop overlapping writes. The next agent reads the checkpoint and inspects actual files before continuing.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#798c80" stroke-width="1.5"/></marker></defs>
  <rect width="1280" height="450" rx="20" fill="#f3efe6"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="40" y="50" fill="#607065" font-size="16" font-weight="700" letter-spacing="2">HOW THE HANDOFF WORKS</text>
    <text x="40" y="98" fill="#17342c" font-size="34" font-weight="700" letter-spacing="-.7">Three steps. One shared project.</text>
    <rect x="40" y="138" width="368" height="229" rx="16" fill="#fffdf8" stroke="#d9dcd1"/>
    <rect x="456" y="138" width="368" height="229" rx="16" fill="#173c32"/>
    <rect x="872" y="138" width="368" height="229" rx="16" fill="#fffdf8" stroke="#d9dcd1"/>
    <path d="M417 253H443" stroke="#798c80" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M833 253H859" stroke="#798c80" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="79" cy="178" r="18" fill="#f2dfd0"/>
    <text x="73" y="184" fill="#8f5135" font-size="16" font-weight="700">1</text>
    <text x="64" y="239" fill="#17342c" font-size="29" font-weight="700">Work in one agent</text>
    <text x="64" y="282" fill="#53665a" font-size="22">Make useful progress.</text>
    <text x="64" y="315" fill="#53665a" font-size="22">Keep unfinished work intact.</text>
    <circle cx="495" cy="178" r="18" fill="#bce1c6"/>
    <text x="489" y="184" fill="#173c32" font-size="16" font-weight="700">2</text>
    <text x="480" y="239" fill="#f5f5e9" font-size="29" font-weight="700">Save a checkpoint</text>
    <text x="480" y="282" fill="#c5dbcb" font-size="22">Scope, state and evidence.</text>
    <text x="480" y="315" fill="#c5dbcb" font-size="22">Leave a clear next action.</text>
    <circle cx="911" cy="178" r="18" fill="#dce9dc"/>
    <text x="905" y="184" fill="#35634a" font-size="16" font-weight="700">3</text>
    <text x="896" y="239" fill="#17342c" font-size="29" font-weight="700">Resume in the next</text>
    <text x="896" y="282" fill="#53665a" font-size="22">Read context. Inspect files.</text>
    <text x="896" y="315" fill="#53665a" font-size="22">Continue the remaining task.</text>
    <circle cx="48" cy="409" r="4" fill="#ad6947"/>
    <text x="63" y="415" fill="#5a685b" font-size="19">Stop overlapping writers before switching. You open the next agent.</text>
  </g>
</svg>
