<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">The shared notebook idea</title>
  <desc id="desc">Agent A writes progress into HANDOFF.md. Agent B reads it, checks the real files and continues.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#798c80" stroke-width="1.5"/></marker></defs>
  <rect width="1280" height="520" rx="20" fill="#f3efe6"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="40" y="50" fill="#607065" font-size="16" font-weight="700" letter-spacing="2">THE BIG IDEA</text>
    <text x="40" y="98" fill="#17342c" font-size="34" font-weight="700" letter-spacing="-.7">One notebook, any agent.</text>
<rect x="40" y="138" width="320" height="250" rx="16" fill="#fffdf8" stroke="#d9dcd1"/>
<text x="64" y="190" fill="#17342c" font-size="27" font-weight="700">Agent A</text>
<text x="64" y="232" fill="#53665a" font-size="20">Works on your project.</text>
<text x="64" y="264" fill="#53665a" font-size="20">Writes down where it is</text>
<text x="64" y="296" fill="#53665a" font-size="20">after every step.</text>
<text x="64" y="352" fill="#8f5135" font-size="18" font-weight="700">then stops or hits a limit</text>
<path d="M372 263H440" stroke="#798c80" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="450" y="118" width="380" height="290" rx="16" fill="#173c32"/>
<text x="478" y="170" fill="#f5f5e9" font-size="27" font-weight="700">HANDOFF.md</text>
<text x="478" y="198" fill="#c5dbcb" font-size="17">the shared notebook in your project</text>
<circle cx="490" cy="237" r="5" fill="#bce1c6"/><text x="508" y="243" fill="#f5f5e9" font-size="20">The goal and when it is done</text>
<circle cx="490" cy="273" r="5" fill="#bce1c6"/><text x="508" y="279" fill="#f5f5e9" font-size="20">What is finished and checked</text>
<circle cx="490" cy="309" r="5" fill="#bce1c6"/><text x="508" y="315" fill="#f5f5e9" font-size="20">What is half-done</text>
<circle cx="490" cy="345" r="5" fill="#bce1c6"/><text x="508" y="351" fill="#f5f5e9" font-size="20">Proof: what was tested</text>
<circle cx="490" cy="381" r="5" fill="#bce1c6"/><text x="508" y="387" fill="#f5f5e9" font-size="20">One clear next step</text>
<path d="M842 263H910" stroke="#798c80" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="920" y="138" width="320" height="250" rx="16" fill="#fffdf8" stroke="#d9dcd1"/>
<text x="944" y="190" fill="#17342c" font-size="27" font-weight="700">Agent B</text>
<text x="944" y="232" fill="#53665a" font-size="20">Reads the notebook first.</text>
<text x="944" y="264" fill="#53665a" font-size="20">Checks the real files.</text>
<text x="944" y="296" fill="#53665a" font-size="20">Continues from the next step.</text>
<text x="944" y="352" fill="#35634a" font-size="18" font-weight="700">no re-explaining needed</text>
<text x="40" y="444" fill="#53665a" font-size="19">Like the notebook nurses hand over at a shift change: the next person reads it, then checks the patient.</text>
<text x="40" y="472" fill="#53665a" font-size="19">The notebook is a hint, not the truth. The files in your project always win.</text>
  </g>
</svg>
