<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1015" viewBox="0 0 640 1015" role="img" aria-labelledby="title desc">
<title id="title">Work, checkpoint, resume</title><desc id="desc">Work in one agent, save useful context to the project, stop overlapping writers, then resume in the next agent after inspecting files.</desc>
<rect width="640" height="1015" rx="20" fill="#f3efe6"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<text x="40" y="48" fill="#607065" font-size="16" font-weight="700" letter-spacing="2">HOW THE HANDOFF WORKS</text>
<text x="40" y="96" fill="#17342c" font-size="35" font-weight="700">One shared project.</text>
<rect x="40" y="138" width="560" height="229" rx="16" fill="#fffdf8" stroke="#d9dcd1"/>
    <circle cx="79" cy="178" r="18" fill="#f2dfd0"/>
    <text x="73" y="184" fill="#8f5135" font-size="16" font-weight="700">1</text>
    <text x="64" y="239" fill="#17342c" font-size="29" font-weight="700">Work in one agent</text>
    <text x="64" y="282" fill="#53665a" font-size="22">Make useful progress.</text>
    <text x="64" y="315" fill="#53665a" font-size="22">Keep unfinished work intact.</text>

<path d="M320 379V405M314 399L320 405L326 399" fill="none" stroke="#798c80" stroke-width="2"/>
<rect x="40" y="418" width="560" height="229" rx="16" fill="#173c32"/>
<g transform="translate(-416 280)">    <circle cx="495" cy="178" r="18" fill="#bce1c6"/>
    <text x="489" y="184" fill="#173c32" font-size="16" font-weight="700">2</text>
    <text x="480" y="239" fill="#f5f5e9" font-size="29" font-weight="700">Save a checkpoint</text>
    <text x="480" y="282" fill="#c5dbcb" font-size="22">Scope, state and evidence.</text>
    <text x="480" y="315" fill="#c5dbcb" font-size="22">Leave a clear next action.</text>
</g>
<path d="M320 659V685M314 679L320 685L326 679" fill="none" stroke="#798c80" stroke-width="2"/>
<rect x="40" y="698" width="560" height="229" rx="16" fill="#fffdf8" stroke="#d9dcd1"/>
<g transform="translate(-832 560)">    <circle cx="911" cy="178" r="18" fill="#dce9dc"/>
    <text x="905" y="184" fill="#35634a" font-size="16" font-weight="700">3</text>
    <text x="896" y="239" fill="#17342c" font-size="29" font-weight="700">Resume in the next</text>
    <text x="896" y="282" fill="#53665a" font-size="22">Read context. Inspect files.</text>
    <text x="896" y="315" fill="#53665a" font-size="22">Continue the remaining task.</text>
</g>
<text x="40" y="969" fill="#5a685b" font-size="21">Stop overlapping writers before switching.</text>
</g></svg>