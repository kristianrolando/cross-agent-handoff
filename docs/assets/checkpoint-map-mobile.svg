<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1020" viewBox="0 0 640 1020" role="img" aria-labelledby="title desc">
<title id="title">A checkpoint keeps useful context</title><desc id="desc">Illustrative greeting checkpoint and four questions: goal, verified or unfinished state, checks and inputs, next action. This is an example, not test evidence.</desc>
<rect width="640" height="1020" rx="20" fill="#102d2a"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<text x="30" y="49" fill="#a5c2b3" font-size="16" font-weight="700" letter-spacing="2">A SMALL FILE. USEFUL CONTEXT.</text>
<text x="30" y="100" fill="#f2f4e8" font-size="33" font-weight="700">What the next agent needs.</text>
<g transform="translate(-10 0)">    <rect x="40" y="140" width="580" height="361" rx="14" fill="#f5f1e7"/>
    <path d="M40 194H620" stroke="#d7dbd0"/>
    <text x="66" y="175" fill="#284b3c" font-family="'SFMono-Regular',Consolas,monospace" font-size="21" font-weight="600">HANDOFF.md</text>
    <rect x="460" y="155" width="135" height="26" rx="13" fill="#e4e6d9"/>
    <text x="475" y="173" fill="#63705a" font-size="13" font-weight="600">EXAMPLE EXCERPT</text>
    <g font-family="'SFMono-Regular',Consolas,monospace" font-size="21">
      <text x="66" y="232" fill="#9c5a37">## Task</text>
      <text x="66" y="263" fill="#27483b">Handle blank greeting names.</text>
      <text x="66" y="307" fill="#9c5a37">## State</text>
      <text x="66" y="338" fill="#27483b">Named greeting saved.</text>
      <text x="66" y="369" fill="#27483b">Blank fallback unfinished.</text>
      <text x="66" y="413" fill="#9c5a37">## Evidence / Next</text>
      <text x="66" y="444" fill="#27483b">Blank case: not_run.</text>
      <text x="66" y="475" fill="#27483b">Next: add fallback and check.</text>
    </g>
</g>
<text x="32" y="553" fill="#9fcbb0" font-size="16" font-weight="700" letter-spacing="1.4">PROJECT + TASK</text>
<text x="32" y="589" fill="#eef2e5" font-size="26">What are we doing, and why?</text>
<path d="M32 615H608M32 723H608M32 831H608" stroke="#436958"/>
<text x="32" y="661" fill="#9fcbb0" font-size="16" font-weight="700" letter-spacing="1.4">STATE</text>
<text x="32" y="697" fill="#eef2e5" font-size="26">What is verified? What remains?</text>
<text x="32" y="769" fill="#9fcbb0" font-size="16" font-weight="700" letter-spacing="1.4">EVIDENCE</text>
<text x="32" y="805" fill="#eef2e5" font-size="26">What was checked, on which inputs?</text>
<text x="32" y="877" fill="#9fcbb0" font-size="16" font-weight="700" letter-spacing="1.4">NEXT</text>
<text x="32" y="913" fill="#eef2e5" font-size="26">What should happen next?</text>
<text x="32" y="978" fill="#b6cabc" font-size="18">Illustrative example. Inspect the actual files.</text>
</g></svg>