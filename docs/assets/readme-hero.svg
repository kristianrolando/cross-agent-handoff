<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">Cross-Agent Handoff: switch agents, keep the work</title>
  <desc id="desc">Claude Code and Codex use a shared project checkpoint. The project holds the context between sessions. One writer at a time.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 H 0 V 28" fill="none" stroke="#23433f" stroke-width="1"/></pattern>
  </defs>
  <rect width="1280" height="500" rx="24" fill="#f3efe6"/>
  <path d="M706 0H1256Q1280 0 1280 24V476Q1280 500 1256 500H706Z" fill="#102d2a"/>
  <path d="M706 0H1256Q1280 0 1280 24V476Q1280 500 1256 500H706Z" fill="url(#grid)" opacity=".48"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <rect x="48" y="40" width="34" height="34" rx="9" fill="#172c2a"/>
    <path d="M56 51H72L67 46M74 63H58L63 68" fill="none" stroke="#f3efe6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="63" fill="#213a36" font-size="17" font-weight="700" letter-spacing="2">CROSS-AGENT HANDOFF</text>
    <text x="48" y="180" fill="#152d29" font-size="72" font-weight="750" letter-spacing="-3">Switch agents.</text>
    <text x="48" y="264" fill="#152d29" font-size="72" font-weight="750" letter-spacing="-3">Keep the work.</text>
    <text x="50" y="322" fill="#455851" font-size="25">Leave useful context in your project.</text>
    <text x="50" y="359" fill="#455851" font-size="25">Continue with your next agent or session.</text>
    <line x1="50" y1="406" x2="652" y2="406" stroke="#d2d7cd"/>
    <text x="50" y="447" fill="#53645b" font-size="17" font-weight="600">FILES FIRST</text>
    <circle cx="186" cy="441" r="3" fill="#a1ada3"/>
    <text x="209" y="447" fill="#53645b" font-size="17" font-weight="600">NO CROSS-VENDOR API</text>
    <text x="746" y="56" fill="#a8c7bd" font-size="15" font-weight="600" letter-spacing="2">THE PROJECT HOLDS THE CONTEXT</text>
    <path d="M880 135H970V182M1112 135H1024V182" fill="none" stroke="#6b998b" stroke-width="2.5"/>
    <rect x="752" y="92" width="186" height="64" rx="12" fill="#f0d5c2"/>
    <circle cx="777" cy="124" r="6" fill="#ad5f3c"/>
    <text x="794" y="131" fill="#5c3728" font-size="21" font-weight="600">Claude Code</text>
    <rect x="1050" y="92" width="182" height="64" rx="12" fill="#d4e8dc"/>
    <circle cx="1077" cy="124" r="6" fill="#307565"/>
    <text x="1095" y="131" fill="#20473a" font-size="22" font-weight="600">Codex</text>
    <rect x="802" y="185" width="379" height="225" rx="15" fill="#091f1c" stroke="#527e70" stroke-width="1.5"/>
    <path d="M802 231H1181" stroke="#345b4e"/>
    <path d="M822 202H836L841 207V219H822Z" fill="none" stroke="#b1d2bd" stroke-width="1.5"/>
    <text x="856" y="214" fill="#ecf4e7" font-family="'SFMono-Regular',Consolas,monospace" font-size="20" font-weight="600">HANDOFF.md</text>
    <text x="827" y="269" fill="#82a99b" font-size="15" letter-spacing="1">GOAL</text>
    <text x="827" y="295" fill="#eef4e9" font-size="21">What we are working on</text>
    <text x="827" y="329" fill="#82a99b" font-size="15" letter-spacing="1">STATE + EVIDENCE</text>
    <text x="827" y="355" fill="#eef4e9" font-size="21">What is saved and verified</text>
    <text x="827" y="389" fill="#b9ddc8" font-size="20" font-weight="600">Next: one actionable step</text>
    <text x="845" y="452" fill="#b7d1c5" font-size="17">Same project. One writer at a time.</text>
  </g>
</svg>
